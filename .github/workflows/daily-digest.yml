name: Daily AI digest

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 10:00 по Москве (UTC+3). Для другого пояса измените час.
  workflow_dispatch: {}    # ручной запуск для проверки

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-digest-agent/requirements.txt
      - run: pip install -r ai-digest-agent/requirements.txt
      - run: python ai-digest-agent/agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DIGEST_TZ: Europe/Moscow
