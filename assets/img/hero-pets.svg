<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-labelledby="heroPetsTitle">
  <title id="heroPetsTitle">Чорне цуценя та руде кошеня визирають крізь розірваний папір</title>

  <!-- terracotta backing so the hole reads correctly on any surface -->
  <rect x="0" y="0" width="700" height="700" fill="#C8633F"/>

  <!-- torn hole (dark interior): smooth curves on top/sides, jagged tear along the bottom -->
  <path fill="#241A16" d="
    M 350 55
    C 470 55 566 118 600 222
    C 630 314 622 418 582 494
    C 566 524 546 550 522 572
    L 494 546 L 470 580 L 442 550 L 418 584
    L 390 552 L 364 586 L 336 554
    L 308 588 L 280 556 L 252 582
    C 196 566 152 522 126 458
    C 96 384 104 288 154 208
    C 200 132 268 62 350 55 Z"/>

  <!-- torn-edge highlight ring, only along the jagged tear -->
  <path fill="none" stroke="#F0C7A8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.5" d="
    M 522 572
    L 494 546 L 470 580 L 442 550 L 418 584
    L 390 552 L 364 586 L 336 554
    L 308 588 L 280 556 L 252 582"/>

  <!-- ============ PUPPY (upper) ============ -->
  <g>
    <path fill="#1B1310" d="M292 232 Q230 187 240 282 Q244 348 314 334 Z"/>
    <path fill="#1B1310" d="M408 232 Q470 187 460 282 Q456 348 386 334 Z"/>
    <ellipse cx="350" cy="350" rx="128" ry="118" fill="#221713"/>
    <ellipse cx="350" cy="396" rx="62" ry="46" fill="#2E211C"/>
    <ellipse cx="350" cy="376" rx="17" ry="13" fill="#0E0906"/>
    <path fill="none" stroke="#0E0906" stroke-width="4" stroke-linecap="round" d="M350 388 v14 M350 402 q-16 14 -32 6 M350 402 q16 14 32 6"/>
    <circle cx="306" cy="338" r="11" fill="#0E0906"/>
    <circle cx="394" cy="338" r="11" fill="#0E0906"/>
    <circle cx="310" cy="334" r="3.4" fill="#C9906A"/>
    <circle cx="398" cy="334" r="3.4" fill="#C9906A"/>
  </g>

  <!-- ============ KITTEN (lower, in front) ============ -->
  <g>
    <path fill="#E8823A" stroke="#0E0906" stroke-width="3" stroke-linejoin="round" d="M312 512 L288 446 L354 482 Z"/>
    <path fill="#E8823A" stroke="#0E0906" stroke-width="3" stroke-linejoin="round" d="M392 512 L418 444 L450 488 Z"/>
    <path fill="#F2A868" d="M316 500 L300 462 L336 482 Z"/>
    <path fill="#F2A868" d="M388 500 L404 466 L426 486 Z"/>
    <ellipse cx="352" cy="562" rx="96" ry="86" fill="#EB8B42"/>
    <ellipse cx="352" cy="586" rx="44" ry="28" fill="#F6B679"/>
    <ellipse cx="320" cy="554" rx="9" ry="12" fill="#0E0906"/>
    <ellipse cx="384" cy="554" rx="9" ry="12" fill="#0E0906"/>
    <circle cx="323" cy="550" r="2.6" fill="#F6D9B8"/>
    <circle cx="387" cy="550" r="2.6" fill="#F6D9B8"/>
    <path fill="#B85A20" d="M352 574 l-9 8 h18 Z"/>
    <path fill="none" stroke="#0E0906" stroke-width="3.5" stroke-linecap="round" d="M352 582 v6 M352 588 q-10 10 -22 4 M352 588 q10 10 22 4"/>
    <g stroke="#0E0906" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
      <line x1="296" y1="576" x2="256" y2="570"/>
      <line x1="296" y1="588" x2="256" y2="592"/>
      <line x1="408" y1="576" x2="448" y2="570"/>
      <line x1="408" y1="588" x2="448" y2="592"/>
    </g>
    <!-- front paws resting on the torn edge -->
    <ellipse cx="298" cy="608" rx="26" ry="20" fill="#EB8B42"/>
    <ellipse cx="406" cy="608" rx="26" ry="20" fill="#EB8B42"/>
  </g>
</svg>
